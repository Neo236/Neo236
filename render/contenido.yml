# El typing es la unica pieza animada en vivo del encabezado. Se sirve desde
# el fork propio (readme-typing-svg) y comparte caja con las demas tarjetas.
# El proyecto "typing-aguara" en Vercel esta ENLAZADO al repo, asi que cada
# push a main despliega solo. El proyecto viejo "readme-typing-svg" no lo
# estaba: se desplegaba subiendo archivos a mano, y por eso los cambios
# pusheados no aparecian nunca.
typing:
  base: "https://typing-aguara-neo236s-projects.vercel.app/"
  parametros:
    font: "Fira Code"
    weight: 500
    size: 18
    duration: 3000      # tiempo de tipeo de la linea MAS LARGA; el resto escala
                        # proporcional, o sea velocidad constante por caracter
    pause: 2400         # sostiene la linea escrita. FIJA: no depende del largo.
                        # Antes decia 900 pero se sentia ~2000 porque el path
                        # seguia creciendo despues de que el texto ya estaba
                        # entero. Sacado ese tiempo muerto, hay que declararla.
    restPause: 1600     # vacio con el cursor parpadeando. Tambien fija, y mas
                        # corta que pause: cuesta mas leer que esperar.
    padding: 20
    borderRadius: 4
    center: false
    vCenter: true
    width: 831
    height: 64
  lineas:
    - "Fullstack: del server al pastizal"
    - "Cazando bugs en el pastizal"
    - "sudo apt install café"
    - 'console.log("otra vez de noche")'
    - "Olfateando el bug en el log"
    - "deploy > dormir"
    - "Dejando rastro de commits en el barro"
    - "catch (bug) { cazar(bug) }"
    - "Orejas paradas, atento al stack trace"
    - "npm run madrugada"
    - "Nocturno por naturaleza"
    - "return café ?? más_café"
    - "Ladrido ronco, código limpio"
    - "git push --set-upstream monte"
    - "Aguará guazú entre los repos"
    - "throw new AguaráException()"
    - "Código de punta a punta"
    - "while(true) { aprender() }"
    - 'git commit -m "zancada"'
    - "Cada noche, algo nuevo"
    - "fullstack developer · aguará guazú entre los repos"

