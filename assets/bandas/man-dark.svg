<svg xmlns="http://www.w3.org/2000/svg" width="831" height="630" viewBox="0 0 831 630" role="img" aria-label="man"><style>@font-face{font-family:'FC';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;font-display:block}@font-face{font-family:'FC';src:url(data:font/woff2;base64,) format('woff2');font-weight:600;font-style:normal;font-display:block}text{white-space:pre}</style><text x="0.0" y="36.9" font-family="FC" font-size="14" font-weight="400" fill="#D9A441" text-anchor="start" style="">neo236@pastizal</text><text x="132.0" y="36.9" font-family="FC" font-size="14" font-weight="400" fill="#A79079" text-anchor="start" style="">:~$</text><text x="163.2" y="36.9" font-family="FC" font-size="14" font-weight="400" fill="#E8722E" text-anchor="start" style="">man aguara-guazu</text><text x="0.0" y="71.4" font-family="FC" font-size="12" font-weight="400" fill="#A79079" text-anchor="start" style="">AGUARÁ-GUAZÚ(1)</text><text x="415.5" y="71.4" font-family="FC" font-size="12" font-weight="400" fill="#A79079" text-anchor="middle" style="">Manual del pastizal</text><text x="831.0" y="71.4" font-family="FC" font-size="12" font-weight="400" fill="#A79079" text-anchor="end" style="">AGUARÁ-GUAZÚ(1)</text><text x="0.0" y="102.1" font-family="FC" font-size="13" font-weight="600" fill="#D9A441" text-anchor="start" style="">NOMBRE</text><text x="40.0" y="128.1" font-family="FC" font-size="13" font-weight="400" fill="#E8722E" text-anchor="start" style="">aguara-guazu</text><text x="141.6" y="128.1" font-family="FC" font-size="13" font-weight="400" fill="#EFE6D8" text-anchor="start" style="">— Subespecie fullstackurus: desarrollador fullstack endémico del Chaco</text><text x="0.0" y="166.1" font-family="FC" font-size="13" font-weight="600" fill="#D9A441" text-anchor="start" style="">SINOPSIS</text><text x="40.0" y="192.1" font-family="FC" font-size="13" font-weight="400" fill="#E8722E" text-anchor="start" style="">aguara-guazu</text><text x="141.6" y="192.1" font-family="FC" font-size="13" font-weight="400" fill="#A79079" text-anchor="start" style="">[--backend java|python|node] [--frontend react|next]</text><text x="40.0" y="214.1" font-family="FC" font-size="13" font-weight="400" fill="#E8722E" text-anchor="start" style="">aguara-guazu</text><text x="141.6" y="214.1" font-family="FC" font-size="13" font-weight="400" fill="#A79079" text-anchor="start" style="">[--datos sql|mongo] [--infra oci] [--gamedev unity]</text><text x="0.0" y="252.1" font-family="FC" font-size="13" font-weight="600" fill="#D9A441" text-anchor="start" style="">DESCRIPCIÓN</text><text x="40.0" y="278.1" font-family="FC" font-size="13" font-weight="400" fill="#EFE6D8" text-anchor="start" style="">Cánido de patas largas y hábitos crepusculares, endémico del Chaco. Construye</text><text x="40.0" y="300.1" font-family="FC" font-size="13" font-weight="400" fill="#EFE6D8" text-anchor="start" style="">backends en Java con Spring Boot y en Python con FastAPI, y resuelve el frontend</text><text x="40.0" y="322.1" font-family="FC" font-size="13" font-weight="400" fill="#EFE6D8" text-anchor="start" style="">en React y Next.js con TypeScript.</text><text x="40.0" y="350.1" font-family="FC" font-size="13" font-weight="400" fill="#EFE6D8" text-anchor="start" style="">Elige la base de datos según la presa: relacional cuando el dato tiene forma,</text><text x="40.0" y="372.1" font-family="FC" font-size="13" font-weight="400" fill="#EFE6D8" text-anchor="start" style="">Mongo cuando todavía no la tiene.</text><text x="0.0" y="410.1" font-family="FC" font-size="13" font-weight="600" fill="#D9A441" text-anchor="start" style="">ENTORNO</text><text x="40.0" y="436.1" font-family="FC" font-size="13" font-weight="400" fill="#D9A441" text-anchor="start" style="">OCI_TENANCY</text><text x="190.0" y="436.1" font-family="FC" font-size="13" font-weight="400" fill="#EFE6D8" text-anchor="start" style="">Territorio propio en Oracle Cloud</text><text x="40.0" y="458.1" font-family="FC" font-size="13" font-weight="400" fill="#D9A441" text-anchor="start" style="">DOCKER</text><text x="190.0" y="458.1" font-family="FC" font-size="13" font-weight="400" fill="#EFE6D8" text-anchor="start" style="">Contenedores y self-hosting de sus propios servicios</text><text x="40.0" y="480.1" font-family="FC" font-size="13" font-weight="400" fill="#D9A441" text-anchor="start" style="">GAMEDEV</text><text x="190.0" y="480.1" font-family="FC" font-size="13" font-weight="400" fill="#EFE6D8" text-anchor="start" style="">C# y Unity, cuando baja el sol</text><text x="0.0" y="518.1" font-family="FC" font-size="13" font-weight="600" fill="#D9A441" text-anchor="start" style="">ESTADO</text><text x="40.0" y="544.1" font-family="FC" font-size="13" font-weight="400" fill="#EFE6D8" text-anchor="start" style="">Casi amenazado. Principal amenaza: los deadlines.</text><text x="0.0" y="582.1" font-family="FC" font-size="13" font-weight="600" fill="#D9A441" text-anchor="start" style="">VER TAMBIÉN</text><text x="40.0" y="608.1" font-family="FC" font-size="13" font-weight="400" fill="#A79079" text-anchor="start" style="">ps(1), tree(1), git-show(1), huellas.sh(1), CREDITOS.md</text></svg>