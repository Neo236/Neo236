name: generar assets del perfil

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # solo cuando cambia el workflow. Sin esto corria en CADA push a main,
      # incluso los que solo tocan el README, y volvia a ejecutar las acciones
      # de terceros sin motivo.
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ---------- snake de contribuciones ----------
      - name: Generar snake con paleta aguará
        # Fijada al SHA, no a la etiqueta: una etiqueta se puede mover y esta
        # accion corre con contents:write sobre el repo. Para actualizarla hay
        # que cambiar el SHA a mano, a proposito.
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b  # v3
        with:
          github_user_name: Neo236
          outputs: |
            dist/snake-dark.svg?color_snake=#E8722E&color_dots=#241C15,#4A3423,#8A5A26,#C88A2E,#D9A441
            dist/snake-light.svg?color_snake=#BC531D&color_dots=#EFE6D8,#E4C98F,#D9A441,#C87A2E,#A85014

      - name: Pintar crin y cola, sacar la barra y enmarcar
        run: |
          # snk corre en Docker y deja los SVG como root -> editar con sudo.
          # s1 = segundo bloque (crin oscura), s3 = punta de la cola (blanca).
          # .u  = barra de progreso inferior -> se oculta.
          # RECORTE. La grilla ocupa y 1.5..110.5 (7 filas de 12px, paso 16) y
          # x 1.5..846.5. La serpiente ademas sale una fila FUERA de la grilla
          # por arriba (y -15.2) y por abajo (y 127.2): son las posiciones de
          # entrada y salida del tablero, y hay que dejarlas entrar enteras.
          #
          # El recorte anterior dejaba 33.5px arriba y 5.5px abajo -> se veia
          # descentrado, y la salida de abajo quedaba rebanada: se veian 3.2px
          # de un cuadrado de 14.4. Con '-16 -16 880 144' quedan 17.5px en los
          # CUATRO lados (igual que el margen horizontal, que ya era 17.5) y
          # las dos posiciones fuera de la grilla entran justas.
          VB_VIEJO='viewBox="-16 -32 880 192"'
          VB_NUEVO='viewBox="-16 -16 880 144"'
          inject () {
            archivo="$1"; snake="$2"; borde="$3"; fondo="$4"
            css="<style>.s.s1{fill:#15100C;stroke:${snake};stroke-width:1px}.s.s3{fill:#FFFFFF;stroke:${snake};stroke-width:1px}.u{display:none}</style>"
            marco="<rect x='-15' y='-15' width='878' height='142' rx='4.5' fill='none' stroke='${borde}' stroke-width='1'/>"
            sudo sed -i "s|</svg>|${css}${marco}</svg>|" "$archivo"
            # el fondo va DETRAS de todo: se inserta justo despues del <svg>,
            # no antes de </svg>, o taparia la grilla. Cubre el viewBox completo,
            # que arranca en (-16,-16).
            relleno="<rect x='-16' y='-16' width='880' height='144' rx='4.5' fill='${fondo}'/>"
            sudo perl -0pi -e "s|(<svg[^>]*>)|\$1${relleno}|" "$archivo"
            if grep -qF "$VB_VIEJO" "$archivo"; then
              sudo sed -i "s|${VB_VIEJO}|${VB_NUEVO}|" "$archivo"
              # el ancho pasa de 880 al ancho real del README (831) y el alto
              # acompana en proporcion (144 * 831/880 = 136), para que la snake
              # quede a la misma escala que las bandas generadas
              sudo sed -i '0,/height="192"/s//height="136"/' "$archivo"
              sudo sed -i '0,/width="880"/s//width="831"/' "$archivo"
            else
              echo "AVISO: el viewBox cambio de forma, revisar el recorte en $archivo"
              grep -o 'viewBox="[^"]*"' "$archivo" | head -1
            fi
          }
          inject dist/snake-dark.svg  "#E8722E" "#3A2A1E" "#15100C"
          inject dist/snake-light.svg "#BC531D" "#E0D3BC" "#F7F0E3"
          echo "-- verificacion --"
          head -c 160 dist/snake-dark.svg; echo
          grep -c 'display:none' dist/snake-dark.svg

      # snk corre en Docker como root y deja dist/ sin permiso de escritura
      # para el usuario `runner`, que es quien ejecuta la Action de la racha.
      - name: Devolver dist/ al usuario del runner
        run: sudo chown -R "$(id -u):$(id -g)" dist && ls -ld dist

      # ---------- racha de contribuciones ----------
      # Se genera acá en vez de enlazar streak-stats.demolab.com: ese servicio
      # respondió 503, 403 y 504 en distintos momentos y rompía la card.
      - name: Generar racha (modo oscuro)
        uses: Neo236/github-readme-streak-stats@main
        with:
          path: dist/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: "user=Neo236&locale=es&card_width=411&card_height=195&hide_border=false&background=15100C&border=3A2A1E&ring=E8722E&fire=D9A441&currStreakNum=EFE6D8&sideNums=EFE6D8&currStreakLabel=E8722E&sideLabels=D9A441&dates=8A7A66"

      - name: Generar racha (modo claro)
        uses: Neo236/github-readme-streak-stats@main
        with:
          path: dist/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: "user=Neo236&locale=es&card_width=411&card_height=195&hide_border=false&background=F7F0E3&border=E0D3BC&ring=BC531D&fire=A17C24&currStreakNum=33261C&sideNums=33261C&currStreakLabel=BC531D&sideLabels=A17C24&dates=8A7A66"

      - name: Verificar lo generado
        run: |
          ls -la dist/
          for f in dist/streak-dark.svg dist/streak-light.svg; do
            test -s "$f" || { echo "VACIO: $f"; exit 1; }
          done

      - name: Publicar en la rama output
        # Esta ademas recibe el GITHUB_TOKEN, con mas razon va fijada al SHA.
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865  # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
